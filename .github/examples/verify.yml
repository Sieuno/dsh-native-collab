name: 基础发布检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: node scripts/verify-build.mjs
      - run: node scripts/check-release.mjs
      - run: node --test tests/release-contract.test.mjs tests/release-exports.test.mjs
