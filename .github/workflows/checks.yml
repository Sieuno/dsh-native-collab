name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/commit-attribution.test.mjs
      - run: node scripts/check-commit-attribution.mjs

  native:
    name: Native SDK / ${{ matrix.sdk }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [native, native-rc2, native-rc4, native-rc5]
        os: [ubuntu-latest, windows-latest]
    env:
      DSH_NATIVE_SDK: .github/sdk/${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: pnpm --dir .github/sdk/${{ matrix.sdk }} install --frozen-lockfile --ignore-scripts --config.auto-install-peers=true
      - run: node scripts/native-build.mjs --check
      - run: npm run validate:package
      - run: npm test
      - run: npm run check:types
      - run: npm run test:sdk
      - run: npm pack --dry-run --ignore-scripts
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
