name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-contracts:
    uses: ./.github/workflows/source-contracts.yml

  unit:
    name: Unit / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.19.0'
          - os: windows-latest
            node: '22.19.0'
          - os: ubuntu-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - uses: ./.github/actions/sdk-typings
      - name: Verify committed build output
        run: node scripts/emit-dist.mjs --check
        env:
          DSH_HOST_CONTRACT: require
      - run: npm run validate:package
      - run: npm test
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code

  sdk:
    name: SDK runtime, strict types and isolated load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .github/sdk/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Prepare locked, executable SDK
        run: node scripts/ci/prepare-sdk.mjs
      - run: node scripts/emit-dist.mjs --check
        env:
          DSH_HOST_CONTRACT: require
      - run: npm run check:types
      - run: npm run check:load
      - run: npm run test:sdk
      - name: Ensure checks did not change tracked files
        run: git diff --exit-code
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
