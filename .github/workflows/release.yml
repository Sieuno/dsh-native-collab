name: 打包并发布安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      # Declaration-only build checks need these optional SDK peers. npm reports them
      # as unmet optional peers, so an explicit install is a no-op; unpack the
      # published tarballs instead. Do not vendor them into the repo, and do not
      # change the lockfile.
      - name: 准备宿主 SDK 声明
        run: |
          mkdir -p _sdk_typings
          cd _sdk_typings
          for target in cordis@4.0.5 schemastery@3.18.5; do
            name="${target%@*}"
            version="${target#*@}"
            npm pack --silent "@deepseek-ai/${name}@${version}"
            mkdir -p "../node_modules/@deepseek-ai/${name}"
            tar -xzf "deepseek-ai-${name}-${version}.tgz" -C "../node_modules/@deepseek-ai/${name}" --strip-components=1
          done
      - name: 核对版本标签
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Tag must match package version");'
      - name: 构建运行文件
        run: node scripts/emit-dist.mjs
        env:
          DSH_HOST_CONTRACT: require
      - name: 生成 TGZ 和发布说明
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json","utf8")); const text=fs.readFileSync("CHANGELOG.md","utf8"); const section=text.split("## "+p.version+"\n")[1]?.split("\n## ")[0]; if(!section) throw new Error("Missing changelog section"); const body="# DSH Native Collab "+p.version+"\n\nDeepseek Harness Agent协作增强（基于原版插件）。\n\nAgent collaboration enhancements for DeepSeek Harness (based on the original plugin).\n\n"+section.trim()+"\n\n安装 / Install:\n\n```sh\ndsh plugin --profile web add @sieuno/dsh-native-collab\n```\n\nWindows、macOS、Linux 使用同一个 TGZ，无需另下安装 ZIP。\n\n安装说明 / Installation: https://github.com/Sieuno/dsh-native-collab/blob/"+process.env.GITHUB_REF_NAME+"/docs/INSTALL.md\n\n非官方社区插件，MIT 许可。\n"; fs.writeFileSync("release-notes.md",body);'
      - name: 发布 GitHub Release（仅 TGZ）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "DSH Native Collab ${GITHUB_REF_NAME#v}" --notes-file release-notes.md release-assets/*.tgz
