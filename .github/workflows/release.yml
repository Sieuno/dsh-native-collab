name: 打包并发布安装包

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - uses: ./.github/actions/sdk-typings
      - name: 核对版本标签
        run: node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME !== "v"+p.version) throw new Error("Tag must match package version");'
      - name: 核对待发布运行文件
        run: node scripts/emit-dist.mjs --check
        env:
          DSH_HOST_CONTRACT: require
      - run: npm run validate:package
      - name: 生成 TGZ 和发布说明
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          node --input-type=module -e '
          import fs from "node:fs";
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const text = fs.readFileSync("CHANGELOG.md", "utf8");
          const match = [...text.matchAll(/^## (.*)$/gm)].find(item =>
            item[1].startsWith(p.version) && /^(?:$|\s|[（(])/.test(item[1].slice(p.version.length)));
          if (!match) throw new Error("Missing changelog section: " + p.version);
          const section = text.slice(match.index + match[0].length).split("\n## ")[0].trim();
          const body = [
            "# DSH Native Collab " + p.version,
            "",
            "Deepseek Harness Agent协作增强（基于原版插件）。",
            "",
            "Agent collaboration enhancements for DeepSeek Harness (based on the original plugin).",
            "",
            section,
            "",
            "安装 / Install:",
            "",
            "```sh",
            "dsh plugin --profile web add @sieuno/dsh-native-collab",
            "```",
            "",
            "Windows、macOS、Linux 使用同一个 TGZ，无需另下安装 ZIP。",
            "",
            "安装说明 / Installation: https://github.com/Sieuno/dsh-native-collab/blob/" + process.env.GITHUB_REF_NAME + "/docs/INSTALL.md",
            "",
            "非官方社区插件，MIT 许可。",
            "",
          ].join("\n");
          fs.writeFileSync("release-notes.md", body);
          '
      - name: 发布 GitHub Release（仅 TGZ）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "DSH Native Collab ${GITHUB_REF_NAME#v}" --notes-file release-notes.md release-assets/*.tgz
