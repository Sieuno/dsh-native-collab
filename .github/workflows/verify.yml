name: 基础发布检查
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      # Declaration-only build checks need these optional SDK peers; do not vendor them or change the lockfile.
      - run: npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps @deepseek-ai/cordis@4.0.5 @deepseek-ai/schemastery@3.18.5
      - run: node scripts/emit-dist.mjs --check
      - run: node scripts/check-release.mjs
      - run: npm test
