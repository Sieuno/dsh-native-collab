# Native services and tool package names stay unchanged. This dependency orders the extension before tool configuration.
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  inject: [collabEnhancements]
- id: preset-minimal
  name: '@deepseek-ai/dsh-agent-preset'
  inject: [collabEnhancements]
- id: preset-ptc
  name: '@deepseek-ai/dsh-agent-preset'
  inject: [collabEnhancements]
- id: preset-cordis
  name: '@deepseek-ai/dsh-agent-preset'
  inject: [collabEnhancements]
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'
  inject: [collabEnhancements]
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  inject: [collabEnhancements]
- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  inject: [collabEnhancements]
- insert:
    - id: dsh-native-collab-ui
      name: '@sieuno/dsh-native-collab'
      disabled: false
